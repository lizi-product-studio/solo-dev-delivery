name: Validate solo-dev-delivery

on:
  push:
  pull_request:

env:
  PYTHONUTF8: '1'

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s portable-agent-kit/tests -v
      - uses: actions/setup-node@v4
        if: matrix.os == 'windows-latest'
        with:
          node-version: '22'
      - name: Windows native delivery and review
        if: matrix.os == 'windows-latest'
        run: |
          python -m unittest discover -s tests -p test_delivery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_delivery_path.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_review_engine.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows worker stop and ownership recovery
        if: matrix.os == 'windows-latest'
        run: |
          python -m unittest discover -s tests -p test_worker_stop.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_resource_stop.py -v
  native-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
  package:
    needs: [portable, native-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export and verify self-contained package
        run: |
          python scripts/export_skill.py "$RUNNER_TEMP/solo-export/solo-dev-delivery"
          python "$RUNNER_TEMP/solo-export/solo-dev-delivery/scripts/install_agent.py" --destination "$RUNNER_TEMP/solo-host/skills"
          python "$RUNNER_TEMP/solo-export/solo-dev-delivery/scripts/install_agent.py" --destination "$RUNNER_TEMP/solo-host/skills" --verify
      - name: Verify downloadable package matches canonical source
        run: |
          cmp "$RUNNER_TEMP/solo-export/solo-dev-delivery-"*.zip packages/solo-dev-delivery-*.zip
          sha256sum -c packages/*.sha256
